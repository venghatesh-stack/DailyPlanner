<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#15161a">
  <title>Offline · DailyPlanner</title>
  <link rel="icon" href="/static/icons/icon-192.png">
  <style>
    :root { color-scheme: light dark; }
    html, body { height: 100%; margin: 0; }
    body {
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f7f8fa;
      color: #1f2330;
      display: flex; align-items: center; justify-content: center;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    @media (prefers-color-scheme: dark) {
      body { background: #0f1115; color: #e8eaf0; }
      .card { background: #181b22; border-color: #232733; }
      .btn { background: var(--color-primary); color: var(--color-on-primary); }
    }
    .card {
      max-width: 420px; width: calc(100% - 32px);
      background: var(--color-surface); border: 1px solid #e4e6ee; border-radius: 16px;
      padding: 28px 24px; text-align: center;
      box-shadow: 0 6px 24px rgba(15, 17, 21, 0.06);
    }
    .icon { width: 64px; height: 64px; border-radius: 14px; margin: 0 auto 14px; display:block; }
    h1 { font-size: 20px; margin: 0 0 6px; font-weight: 600; }
    p  { margin: 0 0 18px; opacity: 0.78; }
    .btn {
      appearance: none; border: 0; cursor: pointer;
      background: var(--color-primary); color: var(--color-on-primary);
      padding: 10px 18px; border-radius: 10px; font-weight: 600;
      font-size: 15px;
    }
    .btn:active { transform: translateY(1px); }
    .hint { margin-top: 14px; font-size: 13px; opacity: 0.6; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--color-danger); margin-right: 6px; vertical-align: 2px; }
    .dot.ok { background: #22c55e; }
  </style>
</head>
<body>
  <main class="card">
    <img class="icon" src="/static/icons/icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>This page isn't cached yet. Reconnect and we'll load it for you.</p>
    <button class="btn" onclick="location.reload()">Retry</button>
    <p class="hint"><span id="status" class="dot"></span><span id="statusText">Checking connection…</span></p>
  </main>
  <script>
    const dot  = document.getElementById("status");
    const text = document.getElementById("statusText");
    function refresh() {
      const online = navigator.onLine;
      dot.classList.toggle("ok", online);
      text.textContent = online ? "Connection restored — tap Retry" : "No network";
    }
    refresh();
    addEventListener("online",  refresh);
    addEventListener("offline", refresh);
    // Auto-reload as soon as the network returns.
    addEventListener("online", () => setTimeout(() => location.reload(), 600));
  </script>
</body>
</html>
