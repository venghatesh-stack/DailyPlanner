<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{ title }} — DailyPlanner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="{{ url_for('static', filename='design-system.css') }}">
<script src="/static/js/vendor/feather-4.29.2.min.js"></script>
<script src="{{ url_for('static', filename='js/global.js') }}"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  body { background: var(--color-bg); color: var(--color-text); font-family: var(--font-family); margin: 0; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 16px 18px 80px; }
  .guide-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0 14px; }
  .guide-tabs a { font-size: 13px; font-weight: 700; text-decoration: none; padding: 7px 13px; border-radius: 999px; border: 1px solid var(--color-border); color: var(--color-text-secondary); background: var(--color-surface); }
  .guide-tabs a.on { background: var(--color-primary); color: var(--color-on-primary); border-color: transparent; }
  .print-btn { margin-left: auto; }
  .md { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 16px; padding: 22px 26px; line-height: 1.62; font-size: 15px; }
  .md h1 { font-size: 26px; font-weight: 900; letter-spacing: -.02em; margin: 6px 0 12px; }
  .md h2 { font-size: 21px; font-weight: 800; margin: 26px 0 10px; padding-bottom: 6px; border-bottom: 2px solid var(--color-border); }
  .md h3 { font-size: 17px; font-weight: 800; margin: 20px 0 8px; }
  .md h4 { font-size: 15px; font-weight: 800; margin: 16px 0 6px; }
  .md p { margin: 10px 0; }
  .md ul, .md ol { margin: 10px 0; padding-left: 24px; }
  .md li { margin: 4px 0; }
  .md code { background: var(--color-bg); border: 1px solid var(--color-border); border-radius: 5px; padding: 1px 5px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; }
  .md pre { background: var(--color-bg); border: 1px solid var(--color-border); border-radius: 10px; padding: 12px 14px; overflow-x: auto; }
  .md pre code { background: none; border: none; padding: 0; font-size: 12.5px; line-height: 1.4; white-space: pre; }
  .md blockquote { border-left: 4px solid var(--color-primary); margin: 12px 0; padding: 4px 14px; color: var(--color-text-secondary); background: var(--color-bg); border-radius: 0 8px 8px 0; }
  .md table { border-collapse: collapse; width: 100%; margin: 12px 0; font-size: 14px; }
  .md th, .md td { border: 1px solid var(--color-border); padding: 7px 10px; text-align: left; }
  .md th { background: var(--color-bg); font-weight: 800; }
  .md a { color: var(--color-primary-ink); }
  .md hr { border: none; border-top: 1px solid var(--color-border); margin: 20px 0; }
  @media print { .nav-icons, .guide-tabs { display: none; } .md { border: none; padding: 0; } body { background: var(--color-surface); } }
</style>
{% include "_pwa_head.html" %}
</head>
<body>
<div class="nav-icons">{% include "_top_nav.html" %}</div>
<div class="wrap">
  <div class="guide-tabs">
    {% for g in guides %}
      <a href="/interview-prep/guides/{{ g.slug }}" class="{{ 'on' if g.slug == slug else '' }}">{{ g.title }}</a>
    {% endfor %}
    <a href="javascript:window.print()" class="print-btn" title="Save as PDF / print">⤓ PDF</a>
  </div>
  <div class="md" id="md-out">Loading…</div>
</div>
<script>
  const MD = {{ content|tojson }};
  try {
    document.getElementById("md-out").innerHTML = marked.parse(MD);
  } catch (e) {
    document.getElementById("md-out").textContent = MD;
  }
  if (window.feather) feather.replace();
</script>
</body>
</html>
