<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="csrf-token" content="{{ csrf_token() }}">
<title>Goal Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="{{ url_for('static', filename='design-system.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='components.css') }}">
<script src="/static/js/vendor/feather-4.29.2.min.js"></script>
<script src="{{ url_for('static', filename='js/global.js') }}"></script>
<script src="{{ url_for('static', filename='js/toast.js') }}"></script>
{% include "_pwa_head.html" %}
</head>
<body>

<div class="nav-icons">{% include "_top_nav.html" %}</div>

<style>
  .gp-wrap { max-width: 940px; margin: 0 auto; padding: 0 10px 40px; }
  body { overflow-x: hidden; }
  .hero, .row, .newbox { min-width: 0; overflow-wrap: anywhere; }
  .gp-wrap h1 { font-size: 22px; margin: 0 0 4px; }
  .gp-sub { font-size: 13px; color: var(--color-text-secondary); margin: 0 0 14px; }

  /* ── The hero: one pinned goal, the only place that gets to be loud ── */
  .hero { border: 1px solid var(--color-border); border-radius: 16px; padding: 20px 20px 16px;
          margin-bottom: 14px; background: var(--color-surface); position: relative; overflow: hidden; }
  .hero::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 5px; background: var(--color-text-muted); }
  .hero[data-tone="soon"]::before    { background: var(--color-warning); }
  .hero[data-tone="urgent"]::before  { background: var(--color-danger); }
  .hero[data-tone="overdue"]::before { background: var(--color-danger-strong); }
  .hero[data-tone="done"]::before    { background: var(--color-success-strong); }
  .hero-title { font-size: 17px; font-weight: 800; margin: 0 0 10px; }
  /* DAYS : HRS : MINS, with seconds alongside. Tabular figures matter here —
     without them the digits jiggle every tick and the eye keeps re-reading. */
  .clock { display: flex; align-items: flex-end; gap: 4px; flex-wrap: wrap; }
  .clock .seg { display: flex; flex-direction: column; align-items: center; min-width: 62px; }
  /* The countdown is the page, and it reticks every second. Set in the
     data face so the digits have a fixed advance width: with proportional
     figures a 1 is narrower than a 0, so the whole clock shifted sideways
     on most ticks and the DAYS : HRS : MINS separators moved with it.
     Weight 600 rather than 900 because 600 is the heaviest Plex Mono this
     app loads — asking for 900 would get a synthesised bold. */
  .clock .seg b { font-family: var(--font-family-data);
                  font-size: 52px; font-weight: 600; line-height: 1; letter-spacing: -.02em;
                  font-variant-numeric: tabular-nums; }
  .clock .seg i { font-style: normal; font-size: 10px; font-weight: 800; letter-spacing: .1em;
                  text-transform: uppercase; color: var(--color-text-secondary); margin-top: 4px; }
  .clock .sep { font-size: 38px; font-weight: 300; line-height: 1.05; color: var(--color-border);
                padding-bottom: 14px; }
  /* Seconds are supporting detail, not a headline — smaller, and set apart. */
  .clock .seg.secs { min-width: 44px; margin-left: 8px; }
  .clock .seg.secs b { font-size: 26px; color: var(--color-text-secondary); }
  .clock .detail { font-size: 13px; font-weight: 700; color: var(--color-text-secondary);
                   font-variant-numeric: tabular-nums; margin-left: auto; padding-bottom: 6px; }
  /* Only the last day flashes. Anything more and it becomes wallpaper.

     The blink is a CLASS TOGGLE driven by countdown.js, not a CSS animation:
     iOS Low Power Mode pauses animations and Reduce Motion suppresses them,
     which is why the animation-based version showed nothing on phones. A
     discrete state change is throttled by nothing. Under Reduce Motion the
     script pins .flash-on rather than toggling it, so the alert is permanent
     instead of blinking — visible either way. */
  .flash .seg b { color: var(--color-danger-on-tint); }
  .flash.flash-on { background: var(--color-danger-light); }
  .flash.flash-on .seg b { color: var(--color-danger-on-tint); }
  .flash.flash-on::before { background: var(--color-danger) !important; width: 8px; }
  /* Transition the swap so it reads as a pulse rather than a strobe. Motion
     here is a colour fade, which Reduce Motion leaves alone. */
  .hero { transition: background-color .28s ease; }
  /* The colour escalates even when it is not yet flashing, because with every
     unit on screen the unit itself no longer signals urgency. */
  .hero[data-tone="soon"] .clock .seg b   { color: var(--color-warning-on-tint); }
  .hero[data-tone="urgent"] .clock .seg b { color: var(--color-danger-on-tint); }
  .hero[data-tone="overdue"] .clock .seg b { color: var(--color-danger-on-tint); }
  .hero[data-overdue="true"] .clock .seg i::after { content: " over"; }

  .meta { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 12px; font-size: 12.5px;
          font-weight: 700; color: var(--color-text-secondary); }
  .meta b { color: var(--color-text); font-weight: 900; }
  /* The percent is an input that reads as text until you touch it — typing
     over a number you can already see is the whole interaction. */
  /* The progress control. The first version was a number input styled to
     look like plain text until hovered — which hid the fact that it was
     editable at all, and the answer to "how do I enter a %" turned out to be
     "you could not tell you were allowed to". A slider is unambiguous: it
     looks like something you drag, on a phone as much as a desktop. */
  .pctwrap { display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .pctlbl { font-size: 10.5px; font-weight: 800; text-transform: uppercase;
            letter-spacing: .05em; color: var(--color-text-secondary); }
  .pctout { font-size: 15px; font-weight: 900; font-variant-numeric: tabular-nums;
            min-width: 3.2em; color: var(--color-text); }
  .pctplan { font-size: 12.5px; font-weight: 700; color: var(--color-text-secondary); }

  input.pctrange { -webkit-appearance: none; appearance: none; height: 22px;
                   width: 190px; background: transparent; cursor: pointer; margin: 0; }
  input.pctrange.row { width: 108px; height: 18px; }
  /* Track */
  input.pctrange::-webkit-slider-runnable-track {
    height: 8px; border-radius: 999px; background: var(--color-border); }
  input.pctrange::-moz-range-track {
    height: 8px; border-radius: 999px; background: var(--color-border); }
  /* Thumb — deliberately large, because this is dragged with a thumb on a
     phone and the WCAG target size is 24px. */
  input.pctrange::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 22px; height: 22px;
    margin-top: -7px; border-radius: 50%; background: var(--color-primary);
    border: 3px solid var(--color-surface); box-shadow: 0 1px 4px rgba(0,0,0,.3); }
  input.pctrange::-moz-range-thumb {
    width: 22px; height: 22px; border-radius: 50%; background: var(--color-primary);
    border: 3px solid var(--color-surface); box-shadow: 0 1px 4px rgba(0,0,0,.3); }
  input.pctrange.row::-webkit-slider-thumb { width: 18px; height: 18px; margin-top: -5px; }
  input.pctrange.row::-moz-range-thumb { width: 18px; height: 18px; }
  input.pctrange:focus { outline: none; }
  input.pctrange:focus::-webkit-slider-thumb { box-shadow: 0 0 0 4px rgba(37,99,235,.25); }
  /* While dragging, the number it is setting should be the loud thing. */
  input.pctrange:active + .pctout, input.pctrange:focus + .pctout { color: var(--color-primary-ink); }
  .meta .src { font-style: normal; font-size: 11px; font-weight: 700; opacity: .7; }
  .pacebar { height: 8px; border-radius: 999px; background: var(--color-border); overflow: hidden;
             margin: 10px 0 4px; position: relative; }
  .pacebar i { display: block; height: 100%; background: var(--color-primary); }
  /* The notch is where the plan says you should be — the gap to the fill
     is the whole story, and it reads instantly. */
  .pacebar .mark { position: absolute; top: -3px; width: 2px; height: 14px; background: var(--color-text); }

  .coach { margin-top: 12px; padding: 11px 13px; border-radius: 10px; font-size: 13.5px;
           font-weight: 700; line-height: 1.55; border-left: 4px solid; }
  .coach[data-tone="celebrate"] { background: var(--color-success-light); border-color: var(--color-success); color: var(--color-success-on-tint); }
  .coach[data-tone="cheer"]     { background: var(--color-primary-light); border-color: var(--color-primary); color: var(--color-primary-ink); }
  .coach[data-tone="push"]      { background: var(--color-warning-light); border-color: var(--color-warning); color: var(--color-warning-on-tint); }
  .coach[data-tone="scold"]     { background: var(--color-danger-light); border-color: var(--color-danger); color: var(--color-danger-on-tint); }
  .coach[data-tone="alarm"]     { background: var(--color-danger-light); border-color: var(--color-danger); color: var(--color-danger-on-tint); }

  .budget { margin-top: 10px; font-size: 13px; font-weight: 700; padding: 9px 12px; border-radius: 9px;
            background: var(--color-bg); border: 1px dashed var(--color-border); }
  .budget.bad { border-color: var(--color-danger); color: var(--color-danger-on-tint); }

  /* ── The quiet list ── */
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 11px 13px; border: 1px solid var(--color-border);
         border-radius: 11px; margin-bottom: 7px; background: var(--color-surface); }
  .row .rt { font-weight: 800; font-size: 14px; flex: 1; min-width: 0; }
  .row .rc { font-variant-numeric: tabular-nums; font-weight: 900; font-size: 14px; white-space: nowrap; }
  .row .rc[data-tone="soon"]    { color: var(--color-warning-on-tint); }
  .row .rc[data-tone="urgent"]  { color: var(--color-danger-on-tint); }
  .row .rc[data-tone="overdue"] { color: var(--color-danger-on-tint); }
  .row .ru { font-size: 10.5px; font-weight: 800; color: var(--color-text-secondary);
             text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }
  .row[data-tone="urgent"] .rc, .row[data-tone="overdue"] .rc { color: var(--color-danger-on-tint); }
  .row .pin { font-size: 11px; font-weight: 800; border: 1px solid var(--color-border); background: var(--color-bg);
              border-radius: 999px; padding: 3px 9px; cursor: pointer; color: var(--color-text-secondary); }
  .row .pin.on { background: var(--color-primary-hover); color: var(--color-on-primary); border-color: var(--color-primary); }
  .row .prog { font-size: 11.5px; font-weight: 800; color: var(--color-text-secondary); white-space: nowrap; }

  .newbox { border: 1px solid var(--color-border); border-radius: 12px; padding: 12px; margin-bottom: 14px;
            background: var(--color-surface); }
  .newbox .grid { display: grid; grid-template-columns: 2fr 1.2fr 1fr 1fr auto; gap: 8px; }
  .newbox input, .newbox select { font: inherit; font-size: 13.5px; padding: 8px 10px; border-radius: 9px;
            border: 1px solid var(--color-border); background: var(--color-bg); color: var(--color-text); width: 100%; box-sizing: border-box; }
  .newbox label { display: block; font-size: 10.5px; font-weight: 800; text-transform: uppercase;
            letter-spacing: .05em; color: var(--color-text-secondary); margin-bottom: 3px; }
  .newbox .dl-row { display: flex; gap: 6px; }
  .newbox .dl-row select { flex: 0 0 116px; }
  .newbox .dl-row input { flex: 1; min-width: 0; }
  .newbox .dl-row input[hidden] { display: none; }
  .hero.nodate::before { background: var(--color-text-muted); }
  .nodate-msg { font-size: 13.5px; font-weight: 600; color: var(--color-text-secondary);
                margin-bottom: 10px; }
  .inline-dl { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .inline-dl select, .inline-dl input { font: inherit; font-size: 13.5px; padding: 8px 10px;
     border-radius: 9px; border: 1px solid var(--color-border);
     background: var(--color-bg); color: var(--color-text); }
  .inline-dl select { flex: 0 0 116px; } .inline-dl input { flex: 0 1 150px; }
  .inline-dl input[hidden] { display: none; }
  .empty { text-align: center; padding: 34px 16px; color: var(--color-text-secondary); font-size: 14px; }
  .warn { background:var(--color-danger-light); border:1px solid var(--color-danger); color:var(--color-danger-on-tint); padding:11px 13px; border-radius:10px;
          font-size:13px; font-weight:700; margin-bottom:12px; }
  @media (max-width: 720px) {
    .newbox .grid { grid-template-columns: 1fr 1fr; }
    .newbox .dl-row select { flex: 0 0 96px; }
    /* The segmented clock has to shrink or three big numbers plus separators
       overflow a phone. Sized so DAYS : HRS : MINS still fits one line. */
    .clock .seg { min-width: 0; flex: 1; }
    .clock .seg b { font-size: 34px; }
    .clock .seg i { font-size: 9px; letter-spacing: .06em; }
    .clock .sep { font-size: 24px; padding-bottom: 12px; }
    .clock .seg.secs { flex: 0 0 auto; min-width: 34px; margin-left: 4px; }
    .clock .seg.secs b { font-size: 18px; }
    .clock .detail { margin-left: 0; flex: 1 0 100%; padding-top: 6px; }
    /* The row is title + slider + readout + countdown; on a phone the title
       takes its own line and the controls wrap beneath it. */
    .row .rt { flex: 1 0 100%; }
    input.pctrange.row { width: 96px; }
    .pctwrap { gap: 6px; }
    input.pctrange { width: 100%; max-width: 260px; }
  }
</style>

<div class="gp-wrap">
  <h1>⏳ Goal Planner</h1>
  <p class="gp-sub">Give a goal a deadline and it stops being a wish. These are the same objectives as
    <a href="/goals">/goals</a> — add key results there and progress here fills in by itself.</p>

  <div id="warn"></div>

  <div class="newbox">
    <div class="grid">
      <div><label>Goal</label><input id="n-title" type="text" placeholder="e.g. Crack the TPM loop"></div>
      <!-- A deadline is easier to state as a duration than as a date most of
           the time — "45 days", "36 hours" — so the unit picker leads and the
           input follows it. Picking "On a date" swaps in the date field. -->
      <div class="deadline">
        <label>Deadline</label>
        <div class="dl-row">
          <select id="n-unit" title="How you want to give the deadline">
            <option value="days">In days</option>
            <option value="hours">In hours</option>
            <option value="minutes">In minutes</option>
            <option value="date">On a date</option>
          </select>
          <input id="n-amount" type="number" min="1" step="1" placeholder="45">
          <input id="n-when" type="datetime-local" hidden>
        </div>
      </div>
      <div><label>Mins/day</label><input id="n-commit" type="number" min="0" step="15" placeholder="120"></div>
      <div><label>Total hours needed</label><input id="n-effort" type="number" min="0" step="1" placeholder="139"></div>
      <div style="align-self:end"><button class="btn sm" id="n-add" type="button">Add goal</button></div>
    </div>
  </div>

  <div id="hero"></div>
  <div id="list"></div>
</div>

<script src="{{ url_for('static', filename='js/countdown.js') }}"></script>
<script>
(function(){
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const hhmm = (m) => { m=Math.round(m||0); const h=Math.floor(m/60), r=m%60;
                        return h&&r ? h+"h "+r+"m" : (h? h+"h" : r+"m"); };
  let DATA = null;

  const api = async (path, opts) => {
    const r = await fetch(path, Object.assign({credentials:"same-origin",
      headers:{"Content-Type":"application/json",
               "X-CSRFToken":(document.querySelector('meta[name=csrf-token]')||{}).content||""}}, opts||{}));
    const body = await r.json().catch(()=>({}));
    if (!r.ok) throw new Error(body.error || "request failed");
    return body;
  };

  function heroHTML(g){
    const c = g.countdown, d = c.display, p = c.pace, b = c.budget;
    // The notch marks where the plan says you should be; the bar is where
    // you are. The distance between them is the point of the whole widget.
    const bar = p ? `<div class="pacebar"><i style="width:${Math.max(0,Math.min(100,p.progress))}%"></i>`
                    + `<span class="mark" style="left:${Math.max(0,Math.min(100,p.expected))}%"></span></div>` : "";
    const meta = [];
    // Typeable percent. The source label matters: a typed 60% sitting next to
    // key results averaging 20% must never look like the same number.
    const srcNote = g.progress_source === "manual"
        ? `<em class="src" title="Drag to zero and the key-result roll-up takes over again">set by hand${
             g.kr_count ? ` · key results say ${g.rolled_up_progress}%` : ""}</em>`
        : (g.kr_count ? `<em class="src">from ${g.kr_count} key result${g.kr_count===1?"":"s"}</em>`
                      : `<em class="src">drag to set, or add key results</em>`);
    meta.push(`<span class="pctwrap">
        <label class="pctlbl" for="pct-${g.id}">Progress</label>
        <input class="pctrange" id="pct-${g.id}" type="range" min="0" max="100" step="1"
               value="${g.progress}" data-pct="${g.id}" aria-label="Percent complete">
        <output class="pctout" data-pctout="${g.id}">${g.progress}%</output>
        ${p?`<span class="pctplan">plan says <b>${p.expected}%</b></span>`:""} ${srcNote}</span>`);
    if (c.working_days_left) meta.push(`<span><b>${c.working_days_left}</b> working days</span>`);
    if (p && p.gap_days) meta.push(`<span><b>${p.gap_days>0?"+":""}${p.gap_days}</b> days vs plan</span>`);
    if (g.kr_count) meta.push(`<span><b>${g.kr_count}</b> key result${g.kr_count===1?"":"s"}</span>`);
    if (g.next_checkpoint) meta.push(`<span>next: <b>${esc(g.next_checkpoint.title)}</b> in ${g.next_checkpoint.days}d</span>`);

    let budget = "";
    if (b) {
      budget = b.feasible
        ? `<div class="budget">🟢 <b>${hhmm(b.available_minutes)}</b> available at ${hhmm(b.commit_minutes)}/day ·
             needs <b>${hhmm(b.needed_minutes)}</b> · <b>${hhmm(b.surplus_minutes)}</b> of slack</div>`
        : `<div class="budget bad">🔴 <b>${hhmm(b.available_minutes)}</b> available at ${hhmm(b.commit_minutes)}/day
             but this needs <b>${hhmm(b.needed_minutes)}</b> — short by <b>${hhmm(b.shortfall_minutes)}</b>.
             Go to <b>${hhmm(b.required_daily_minutes)}/day</b> or cut scope.</div>`;
    }
    return `<div class="hero" data-tone="${esc(d.tone)}" data-countdown="${esc(c.target_iso)}"
                 data-flash="${c.flash?'true':'false'}">
        <div class="hero-title">${esc(g.title)}</div>
        <div class="clock">
          <span class="seg"><b data-cd-d>${c.breakdown.total_days}</b><i>days</i></span>
          <span class="sep">:</span>
          <span class="seg"><b data-cd-h>${String(c.breakdown.hours).padStart(2,"0")}</b><i>hrs</i></span>
          <span class="sep">:</span>
          <span class="seg"><b data-cd-m>${String(c.breakdown.minutes).padStart(2,"0")}</b><i>mins</i></span>
          <span class="seg secs"><b data-cd-s>${String(c.breakdown.seconds).padStart(2,"0")}</b><i>secs</i></span>
          <span class="detail" data-cd-detail></span>
        </div>
        ${bar}
        <div class="meta">${meta.join("")}</div>
        ${budget}
        <div class="coach" data-tone="${esc(g.coach.tone)}">${esc(g.coach.message)}</div>
      </div>`;
  }

  /* The pinned-but-undated hero. Deliberately not a countdown-shaped shell
     with dashes in it — an empty clock reads as broken. */
  function heroNoDateHTML(g){
    return `<div class="hero nodate">
        <div class="hero-title">${esc(g.title)}</div>
        <div class="nodate-msg">No deadline yet, so there is nothing to count down.
          Give it one below and this becomes a plan.</div>
        <div class="meta">
          <span class="pctwrap">
            <label class="pctlbl" for="pct-${g.id}">Progress</label>
            <input class="pctrange" id="pct-${g.id}" type="range" min="0" max="100" step="1"
                   value="${g.progress}" data-pct="${g.id}" aria-label="Percent complete">
            <output class="pctout" data-pctout="${g.id}">${g.progress}%</output>
            <em class="src">${g.progress_source === "manual" ? "set by hand"
                : (g.kr_count ? `from ${g.kr_count} key result${g.kr_count===1?"":"s"}`
                              : "drag to set, or add key results")}</em>
          </span>
        </div>
        <div class="dl-row inline-dl">
          <select id="h-unit">
            <option value="days">In days</option>
            <option value="hours">In hours</option>
            <option value="minutes">In minutes</option>
            <option value="date">On a date</option>
          </select>
          <input id="h-amount" type="number" min="1" step="1" placeholder="45">
          <input id="h-when" type="datetime-local" hidden>
          <button class="btn sm" id="h-set" type="button" data-goal="${g.id}">Set deadline</button>
        </div>
        <div class="coach" data-tone="${esc(g.coach.tone)}">${esc(g.coach.message)}</div>
      </div>`;
  }

  function rowHTML(g){
    const c = g.countdown;
    const d = c.has_deadline ? c.display : null;
    return `<div class="row" data-tone="${d?esc(d.tone):''}">
        <span class="pin ${g.is_primary?'on':''}" data-pin="${g.id}" title="Pin as the main countdown">
          ${g.is_primary?'★ pinned':'☆ pin'}</span>
        <span class="rt">${esc(g.title)}</span>
        <input class="pctrange row" type="range" min="0" max="100" step="1"
               value="${g.progress}" data-pct="${g.id}" aria-label="Percent complete"
               title="${g.progress_source === 'manual' ? 'Set by hand' : (g.kr_count ? 'From key results' : 'Not set')}">
        <output class="pctout" data-pctout="${g.id}">${g.progress}%</output>
        ${d ? `<span class="rc" data-countdown="${esc(c.target_iso)}" data-flash="false"><span data-cd-compact></span></span>`
            : `<span class="ru">no deadline</span>`}
      </div>`;
  }

  function render(){
    if (!DATA) return;
    /* A background refresh must never rip the field out from under someone
       mid-type. Remember what was focused and put the cursor back. */
    const active = document.activeElement;
    const keepId = (active && active.dataset && active.dataset.pct) ? active.dataset.pct : null;
    // The ticker is an enhancement, not a dependency. If countdown.js failed
    // to load, the server already sent a rendered value and unit for every
    // goal — so the page must still show them, just frozen. Losing the whole
    // planner because a script 404'd would be a bad trade.
    const CD = (typeof Countdown !== "undefined") ? Countdown : null;
    if (CD) CD.clear();                   // detached nodes must stop ticking
    const primary = DATA.goals.find(g => g.id === DATA.primary_id);
    /* A pinned goal with no deadline used to blank the hero entirely — the
       page looked broken while three dated goals sat below it. Honour the pin
       either way: show the goal, and ask for the date that is missing rather
       than silently swapping in a different goal. */
    $("hero").innerHTML = !primary ? ""
      : (primary.countdown.has_deadline ? heroHTML(primary) : heroNoDateHTML(primary));
    const rest = DATA.goals.filter(g => !primary || g.id !== primary.id);
    $("list").innerHTML = rest.length ? rest.map(rowHTML).join("")
      : (primary ? "" : `<div class="empty">No goals yet. Add one above — a title and a date is enough to start.</div>`);
    if (CD) CD.mountAll(document);
    /* Put focus back on the slider that was just dragged, so the arrow keys
       keep working and the page does not jump to the top after a save. */
    if (keepId) {
      const again = document.querySelector(`[data-pct="${keepId}"]`);
      if (again) again.focus({preventScroll: true});
    }
  }

  async function load(){
    try {
      DATA = await api("/api/goal-planner");
      $("warn").innerHTML = "";
      render();
    } catch (e) {
      $("warn").innerHTML = `<div class="warn">${esc(e.message)}</div>`;
    }
  }

  /* Show the field that matches the chosen unit. */
  function syncDeadlineInput(){
    const byDate = $("n-unit").value === "date";
    $("n-amount").hidden = byDate;
    $("n-when").hidden = !byDate;
    const ph = {days: "45", hours: "36", minutes: "90"}[$("n-unit").value];
    if (ph) $("n-amount").placeholder = ph;
  }
  $("n-unit").addEventListener("change", syncDeadlineInput);
  syncDeadlineInput();

  $("n-add").addEventListener("click", async () => {
    const title = ($("n-title").value||"").trim();
    if (!title) { $("n-title").focus(); return; }
    const commit = parseInt($("n-commit").value, 10);
    const effortH = parseFloat($("n-effort").value);
    const payload = {title: title};
    const unit = $("n-unit").value;
    if (unit === "date") {
      // datetime-local has no zone; the server reads it against the user's
      // timezone, which is what the person typing it intends.
      if ($("n-when").value) payload.target_at = $("n-when").value;
    } else {
      // A relative deadline is resolved on the SERVER, not here: the browser
      // clock can be wrong or in another zone, and "45 days from now" has to
      // mean 45 days from the user's now.
      const amount = parseFloat($("n-amount").value);
      if (!isNaN(amount) && amount > 0) payload["in_" + unit] = amount;
    }
    if (!isNaN(commit)) payload.daily_commit_minutes = commit;
    if (!isNaN(effortH)) payload.effort_minutes = Math.round(effortH * 60);
    try {
      await api("/api/goal-planner/goals", {method:"POST", body: JSON.stringify(payload)});
      ["n-title","n-when","n-amount","n-commit","n-effort"].forEach(i => $(i).value = "");
      load();
    } catch (e) { $("warn").innerHTML = `<div class="warn">${esc(e.message)}</div>`; }
  });

  /* Save a typed percentage on blur or Enter — not on every keystroke, which
     would fire a request per digit and re-render the field out from under the
     cursor. Clearing the box sends null, which returns the goal to its
     key-result roll-up. */
  async function savePct(input){
    const id = input.dataset.pct;
    /* A slider cannot be empty, so 0 doubles as "clear the override" when the
       goal has key results to fall back on. Without that there would be no
       way back to the automatic roll-up once you had touched the slider. */
    const goal = DATA && DATA.goals.find(g => g.id === id);
    const raw = (input.value === "0" && goal && goal.kr_count) ? "" : input.value.trim();
    if (input.dataset.saving === "1") return;
    input.dataset.saving = "1";
    try {
      await api("/api/goal-planner/goals/" + id, {
        method: "PATCH", body: JSON.stringify({manual_progress: raw === "" ? "" : raw})});
      await load();          // pace, coach and the budget all move with it
    } catch (e) {
      $("warn").innerHTML = `<div class="warn">${esc(e.message)}</div>`;
      input.dataset.saving = "";
    }
  }

  /* Dragging fires `input` continuously and `change` once on release. Update
     the readout live so the slider feels connected, but only SAVE on release —
     otherwise one drag is a hundred PATCHes and a hundred re-renders. */
  document.addEventListener("input", (ev) => {
    const pct = ev.target.closest("[data-pct]");
    if (!pct) return;
    const out = document.querySelector(`[data-pctout="${pct.dataset.pct}"]`);
    if (out) out.textContent = pct.value + "%";
  });
  document.addEventListener("change", (ev) => {
    const pct = ev.target.closest("[data-pct]");
    if (pct) savePct(pct);
  });

  /* The inline "set a deadline" control on a pinned-but-undated hero. Shares
     the same relative/absolute payload rules as the main form. */
  document.addEventListener("change", (ev) => {
    if (ev.target.id !== "h-unit") return;
    const byDate = ev.target.value === "date";
    $("h-amount").hidden = byDate;
    $("h-when").hidden = !byDate;
  });
  document.addEventListener("click", async (ev) => {
    const set = ev.target.closest("#h-set");
    if (set) {
      const unit = $("h-unit").value;
      const body = {};
      if (unit === "date") {
        if (!$("h-when").value) return;
        body.target_at = $("h-when").value;
      } else {
        const amount = parseFloat($("h-amount").value);
        if (isNaN(amount) || amount <= 0) { $("h-amount").focus(); return; }
        body["in_" + unit] = amount;
      }
      try {
        await api("/api/goal-planner/goals/" + set.dataset.goal,
                  {method:"PATCH", body: JSON.stringify(body)});
        load();
      } catch (e) { $("warn").innerHTML = `<div class="warn">${esc(e.message)}</div>`; }
      return;
    }
    const pin = ev.target.closest("[data-pin]");
    if (!pin) return;
    try {
      await api("/api/goal-planner/goals/" + pin.dataset.pin + "/primary", {method:"POST"});
      load();
    } catch (e) { $("warn").innerHTML = `<div class="warn">${esc(e.message)}</div>`; }
  });

  load();
})();
</script>

<script>document.addEventListener("DOMContentLoaded",()=>{if(window.feather)feather.replace()});</script>
</body>
