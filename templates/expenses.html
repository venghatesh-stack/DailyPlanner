<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="csrf-token" content="{{ csrf_token() }}">
<title>Money — DailyPlanner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="{{ url_for('static', filename='design-system.css') }}">
<script src="/static/js/vendor/feather-4.29.2.min.js"></script>
<script src="{{ url_for('static', filename='js/global.js') }}"></script>
<script src="{{ url_for('static', filename='js/toast.js') }}"></script>
<style>
  body { background: var(--color-bg); color: var(--color-text); font-family: var(--font-family); margin: 0; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 16px 16px 60px; }
  h1 { font-size: 22px; font-weight: 800; letter-spacing: -.02em; margin: 6px 0 2px; }
  .sub { color: var(--color-text-secondary); font-size: 13px; margin: 0 0 16px; }

  .card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 14px; padding: 14px; }

  /* Expense / Income segmented toggle */
  .seg { display: flex; gap: 0; border: 1px solid var(--color-border); border-radius: 10px; overflow: hidden; margin-bottom: 12px; }
  .seg button { flex: 1; font: inherit; font-size: 14px; font-weight: 700; padding: 10px; border: none; background: var(--color-bg); color: var(--color-text-secondary); cursor: pointer; }
  .seg button.on[data-kind="expense"]  { background: var(--color-danger-light); color: var(--color-danger-on-tint); }
  .seg button.on[data-kind="income"]   { background: var(--color-success-light); color: var(--color-success-on-tint); }
  .seg button.on[data-kind="transfer"] { background: var(--color-primary-light); color: var(--color-primary-ink); }
  .seg button + button { border-left: 1px solid var(--color-border); }

  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 12px; font-weight: 600; color: var(--color-text-secondary); }
  .field input {
    font: inherit; font-size: 16px; padding: 10px 12px;
    border: 1px solid var(--color-border); border-radius: 10px;
    background: var(--color-bg); color: var(--color-text); outline: none;
  }
  .field input:focus, .field select:focus { border-color: var(--color-primary); }
  .field select {
    font: inherit; font-size: 15px; padding: 10px 12px;
    border: 1px solid var(--color-border); border-radius: 10px;
    background: var(--color-bg); color: var(--color-text); outline: none;
  }
  .f-date{flex:1 1 150px;} .f-amount{flex:1 1 110px;} .f-cat{flex:2 1 180px;} .f-note{flex:1 1 100%;}
  .f-tag{flex:1 1 160px;} .f-sel{flex:1 1 130px;}
  .add-btn { margin-top: 12px; width: 100%; font: inherit; font-size: 15px; font-weight: 700; padding: 12px; border: none; border-radius: 11px; cursor: pointer; background: var(--color-primary); color: var(--color-on-primary); }
  /* Editing state */
  .card.editing { border-color: var(--color-primary); box-shadow: 0 0 0 2px color-mix(in srgb, var(--color-primary) 22%, transparent); }
  .edit-bar { display: none; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; font-size: 13px; font-weight: 600; color: var(--color-primary-ink); }
  .card.editing .edit-bar { display: flex; }
  .edit-bar button { font: inherit; font-size: 13px; font-weight: 600; background: none; border: 1px solid var(--color-border); border-radius: 8px; padding: 5px 10px; cursor: pointer; color: var(--color-text-secondary); }

  .stats { display: flex; gap: 8px; margin: 18px 0 10px; }
  .stat { flex: 1; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 12px; padding: 10px 12px; text-align: center; }
  .stat .v { font-size: 18px; font-weight: 800; letter-spacing: -.02em; }
  .stat .l { font-size: 11px; color: var(--color-text-secondary); margin-top: 2px; }
  .stat.in .v { color: var(--color-success-on-tint); } .stat.out .v { color: var(--color-danger-on-tint); }

  .list { display: flex; flex-direction: column; gap: 8px; }
  .exp { display: flex; align-items: center; gap: 12px; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 12px; padding: 11px 13px; }
  .exp .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .exp.kind-expense .dot { background: var(--color-danger); } .exp.kind-income .dot { background: var(--color-success); }
  .exp.kind-transfer .dot { background: var(--color-primary); }
  .exp.kind-transfer .amt { color: var(--color-primary-ink); }
  .exp .cat { font-weight: 700; font-size: 15px; }
  .exp .cat.empty { color: var(--color-text-muted, #94a3b8); font-weight: 600; }
  .exp .nt { font-size: 12.5px; color: var(--color-text-secondary); margin-top: 1px; }
  .exp .mid { flex: 1; min-width: 0; }
  .exp .badges { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .exp .badge { font-size: 10.5px; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: var(--color-bg); border: 1px solid var(--color-border); color: var(--color-text-secondary); }
  .exp .badge.rec { background: var(--color-primary-light); border-color: var(--color-primary-border); color: var(--color-primary-ink); }
  .exp .badge.need { background: var(--color-success-light); border-color: var(--color-success-border); color: var(--color-success-on-tint); }
  .exp .badge.want { background: #fff7ed; border-color: #fed7aa; color: #c2410c; }
  .exp .badge.saving { background: var(--color-primary-light); border-color: var(--color-primary-border); color: var(--color-primary-ink); }
  .exp .amt { font-weight: 800; font-size: 16px; white-space: nowrap; }
  .exp.kind-expense .amt { color: var(--color-danger-on-tint); } .exp.kind-income .amt { color: var(--color-success-on-tint); }
  .exp .rcpt { text-decoration: none; font-size: 18px; flex: none; }
  .exp .acts { display: flex; flex-direction: column; gap: 2px; flex: none; }
  .exp .del, .exp .edit { background: none; border: none; cursor: pointer; padding: 4px; display: inline-flex; }
  .exp .del { color: var(--color-danger-on-tint); } .exp .edit { color: var(--color-text-secondary); }
  .exp .del svg, .exp .edit svg { width: 17px; height: 17px; }
  .empty { text-align: center; color: var(--color-text-secondary); font-size: 14px; padding: 26px 0; }

  h2 { font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--color-text-secondary); margin: 28px 0 10px; }
  .rep-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .rep-head input { font: inherit; font-size: 15px; padding: 8px 10px; border: 1px solid var(--color-border); border-radius: 9px; background: var(--color-bg); color: var(--color-text); }
  .pdf-btn { margin-left: auto; font-size: 13px; font-weight: 700; text-decoration: none; padding: 8px 12px; border: 1px solid var(--color-border); border-radius: 9px; background: var(--color-surface); color: var(--color-text); white-space: nowrap; }
  .dissect { display: flex; align-items: center; gap: 8px; margin: 0 2px 10px; }
  .dissect label { font-size: 12px; font-weight: 600; color: var(--color-text-secondary); }
  .dissect select { font: inherit; font-size: 14px; padding: 7px 10px; border: 1px solid var(--color-border); border-radius: 9px; background: var(--color-bg); color: var(--color-text); }
  .cat-row .cn .pct { color: var(--color-text-muted, #94a3b8); font-weight: 500; font-size: 12px; margin-left: 6px; }
  .cat-row { display: flex; align-items: center; gap: 10px; padding: 8px 4px; border-bottom: 1px solid var(--color-border); }
  .cat-row:last-child { border-bottom: none; }
  .cat-row .cn { flex: 1; font-weight: 600; font-size: 14px; }
  .cat-row .bar { flex: 2; height: 8px; background: var(--color-border); border-radius: 999px; overflow: hidden; }
  .cat-row .bar > i { display: block; height: 100%; background: var(--color-danger); border-radius: 999px; }
  .cat-row .ca { font-weight: 700; font-size: 14px; min-width: 80px; text-align: right; }
</style>
{% include "_pwa_head.html" %}
</head>
<body>

<div class="nav-icons">{% include "_top_nav.html" %}</div>

<div class="wrap">
  <h1>💸 Money</h1>
  <p class="sub">Log money spent and received. The category box suggests ones you've used before.</p>

  <div class="card" id="form-card">
    <div class="edit-bar">
      <span>✏️ Editing entry</span>
      <button type="button" id="edit-cancel">Cancel</button>
    </div>
    <div class="seg" id="kind-seg">
      <button type="button" data-kind="expense" class="on">− Expense</button>
      <button type="button" data-kind="income">+ Income</button>
      <button type="button" data-kind="transfer">⇄ Transfer</button>
    </div>
    <form id="exp-form" autocomplete="off">
      <div class="row">
        <div class="field f-date">
          <label for="exp-date">Date</label>
          <input type="date" id="exp-date" value="{{ today }}" max="{{ today }}">
        </div>
        <div class="field f-amount">
          <label for="exp-amount">Amount (₹)</label>
          <input type="number" id="exp-amount" inputmode="decimal" step="0.01" min="0" placeholder="0.00">
        </div>
        <div class="field f-cat">
          <label for="exp-category">Category</label>
          <input type="text" id="exp-category" list="cat-suggestions" placeholder="e.g. Groceries / Salary" maxlength="60">
          <datalist id="cat-suggestions"></datalist>
        </div>
        <div class="field f-tag">
          <label for="exp-tag">Tag (optional)</label>
          <input type="text" id="exp-tag" list="tag-suggestions" placeholder="e.g. Trip / Office" maxlength="40">
          <datalist id="tag-suggestions"></datalist>
        </div>
        <div class="field f-sel">
          <label for="exp-recurrence">Repeats</label>
          <select id="exp-recurrence">
            <option value="none">Single (one-off)</option>
            <option value="daily">Daily</option>
            <option value="monthly">Monthly</option>
            <option value="quarterly">Quarterly</option>
            <option value="yearly">Yearly</option>
          </select>
        </div>
        <div class="field f-sel">
          <label for="exp-needwant">Need / Want</label>
          <select id="exp-needwant">
            <option value="">—</option>
            <option value="need">Need</option>
            <option value="want">Want</option>
            <option value="saving">Saving</option>
          </select>
        </div>
        <div class="field f-sel">
          <label for="exp-costtype">Fixed / Variable</label>
          <select id="exp-costtype">
            <option value="">—</option>
            <option value="fixed">Fixed</option>
            <option value="variable">Variable</option>
          </select>
        </div>
        <div class="field f-note">
          <label for="exp-note">Note (optional)</label>
          <input type="text" id="exp-note" placeholder="What was it for?" maxlength="300">
        </div>
        <div class="field f-note">
          <label>Receipt (optional — saved to Drive)</label>
          <div style="display:flex;gap:8px;align-items:center;">
            <input type="file" id="exp-receipt" accept="image/*,application/pdf" style="flex:1;min-width:0;">
            <input type="file" id="exp-receipt-cam" accept="image/*" capture="environment" hidden>
            <button type="button" id="exp-cam-btn" class="add-btn" style="width:auto;margin:0;padding:10px 14px;" title="Take a photo of the receipt">📷</button>
          </div>
          <div class="sub" id="receipt-indicator" style="display:none;margin:6px 2px 0;"></div>
        </div>
      </div>
      <button type="submit" class="add-btn" id="exp-add">Add</button>
    </form>
  </div>

  <div class="stats">
    <div class="stat in"><div class="v" id="s-in">₹0</div><div class="l">Received</div></div>
    <div class="stat out"><div class="v" id="s-out">₹0</div><div class="l">Spent</div></div>
    <div class="stat"><div class="v" id="s-net">₹0</div><div class="l">Net</div></div>
  </div>

  <div class="list" id="exp-list"></div>

  <!-- Monthly report -->
  <h2>Monthly report</h2>
  <div class="rep-head">
    <input type="month" id="rep-month">
    <a id="rep-pdf" class="pdf-btn" href="#" target="_blank" rel="noopener">📄 PDF</a>
  </div>
  <div class="stats">
    <div class="stat in"><div class="v" id="r-in">₹0</div><div class="l">Income</div></div>
    <div class="stat out"><div class="v" id="r-out">₹0</div><div class="l">Expense</div></div>
    <div class="stat"><div class="v" id="r-net">₹0</div><div class="l">Net</div></div>
  </div>
  <div class="sub" id="r-transfers" style="margin:-4px 2px 6px;"></div>
  <div class="sub" id="r-proj" style="margin:-2px 2px 12px;"></div>

  <div class="dissect">
    <label for="rep-by">Dissect by</label>
    <select id="rep-by">
      <option value="category">Category</option>
      <option value="need_want">Need / Want / Saving</option>
      <option value="cost_type">Fixed / Variable</option>
      <option value="tag">Tag</option>
      <option value="recurrence">Recurrence</option>
    </select>
  </div>
  <div class="card" id="rep-cats"><div class="empty">No spending this month.</div></div>
</div>

<script>
(() => {
  const CSRF = document.querySelector('meta[name="csrf-token"]')?.content || "";
  const $ = (id) => document.getElementById(id);
  const dateEl=$("exp-date"), amountEl=$("exp-amount"), catEl=$("exp-category"), noteEl=$("exp-note");
  const tagEl=$("exp-tag"), recEl=$("exp-recurrence"), needEl=$("exp-needwant"), costEl=$("exp-costtype");
  const form=$("exp-form"), listEl=$("exp-list"), dataList=$("cat-suggestions"), tagList=$("tag-suggestions");
  const repMonth=$("rep-month"), repCats=$("rep-cats"), repBy=$("rep-by"), repPdf=$("rep-pdf");
  const formCard=$("form-card"), addBtn=$("exp-add");
  let kind = "expense";
  let editingId = null;   // null = adding; otherwise the id being edited

  const REC_LABELS={daily:"Daily",monthly:"Monthly",quarterly:"Quarterly",yearly:"Yearly"};
  const NW_LABELS={need:"Need",want:"Want",saving:"Saving"};
  const CT_LABELS={fixed:"Fixed",variable:"Variable"};

  const toast=(m,k="info")=>window.showToast?window.showToast(m,k,2200):console.log(m);
  const esc=(s)=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  const money=(n)=>"₹"+Number(n||0).toLocaleString("en-IN",{maximumFractionDigits:2});

  // Receipt source — either the file picker or the camera.
  let receiptFile = null;
  function showReceipt(){
    const el=$("receipt-indicator");
    if(receiptFile){ el.style.display=""; el.textContent="🧾 "+receiptFile.name; }
    else { el.style.display="none"; el.textContent=""; }
  }
  $("exp-receipt").addEventListener("change",()=>{ receiptFile=$("exp-receipt").files[0]||null; showReceipt(); });
  $("exp-receipt-cam").addEventListener("change",()=>{ receiptFile=$("exp-receipt-cam").files[0]||null; showReceipt(); });
  $("exp-cam-btn").addEventListener("click",()=>$("exp-receipt-cam").click());

  // Kind toggle
  $("kind-seg").querySelectorAll("button").forEach(b=>{
    b.addEventListener("click",()=>{
      kind=b.dataset.kind;
      $("kind-seg").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x.dataset.kind===kind));
    });
  });

  async function loadCategories(){
    try{
      const r=await fetch("/api/expenses/categories",{credentials:"same-origin"});
      const d=await r.json();
      dataList.innerHTML=(d.categories||[]).map(c=>`<option value="${esc(c)}"></option>`).join("");
      tagList.innerHTML=(d.tags||[]).map(c=>`<option value="${esc(c)}"></option>`).join("");
    }catch(_){}
  }

  function badgesFor(it){
    const b=[];
    if(it.recurrence && it.recurrence!=="none") b.push(`<span class="badge rec">↻ ${esc(REC_LABELS[it.recurrence]||it.recurrence)}</span>`);
    if(it.need_want) b.push(`<span class="badge ${esc(it.need_want)}">${esc(NW_LABELS[it.need_want]||it.need_want)}</span>`);
    if(it.cost_type) b.push(`<span class="badge">${esc(CT_LABELS[it.cost_type]||it.cost_type)}</span>`);
    if(it.tag) b.push(`<span class="badge">#${esc(it.tag)}</span>`);
    return b.length?`<div class="badges">${b.join("")}</div>`:"";
  }

  function renderRow(it){
    const div=document.createElement("div");
    div.className="exp kind-"+it.kind;
    div.innerHTML=`
      <span class="dot"></span>
      <div class="mid">
        <div class="cat ${it.category?"":"empty"}">${it.category?esc(it.category):"Uncategorised"}</div>
        ${it.note?`<div class="nt">${esc(it.note)}</div>`:""}
        ${badgesFor(it)}
      </div>
      ${it.receipt_url?`<a class="rcpt" href="${esc(it.receipt_url)}" target="_blank" rel="noopener" title="Receipt: ${esc(it.receipt_name||"")}">🧾</a>`:""}
      <div class="amt">${it.kind==="income"?"+":(it.kind==="transfer"?"⇄ ":"−")}${money(it.amount)}</div>
      <div class="acts">
        <button type="button" class="edit" title="Edit"><i data-feather="edit-2"></i></button>
        <button type="button" class="del" title="Delete"><i data-feather="trash-2"></i></button>
      </div>`;
    div.querySelector(".del").addEventListener("click",()=>del(it.id,div));
    div.querySelector(".edit").addEventListener("click",()=>startEdit(it));
    return div;
  }

  // ── Edit mode ──
  function setKind(k){
    kind=k;
    $("kind-seg").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x.dataset.kind===kind));
  }
  function startEdit(it){
    editingId=it.id;
    setKind(it.kind);
    dateEl.value=it.spent_on||dateEl.value;
    amountEl.value=it.amount;
    catEl.value=it.category||"";
    noteEl.value=it.note||"";
    tagEl.value=it.tag||"";
    recEl.value=it.recurrence||"none";
    needEl.value=it.need_want||"";
    costEl.value=it.cost_type||"";
    formCard.classList.add("editing");
    addBtn.textContent="Save changes";
    formCard.scrollIntoView({behavior:"smooth",block:"start"});
    amountEl.focus();
  }
  function resetForm(){
    editingId=null;
    formCard.classList.remove("editing");
    addBtn.textContent="Add";
    amountEl.value=""; noteEl.value=""; tagEl.value="";
    recEl.value="none"; needEl.value=""; costEl.value="";
    $("exp-receipt").value=""; $("exp-receipt-cam").value="";
    receiptFile=null; showReceipt();
  }
  $("edit-cancel").addEventListener("click",resetForm);

  async function load(){
    try{
      const r=await fetch("/api/expenses?date="+encodeURIComponent(dateEl.value),{credentials:"same-origin"});
      const d=await r.json();
      listEl.innerHTML="";
      if(!d.items.length){ listEl.innerHTML=`<div class="empty">Nothing logged for this day.</div>`; }
      else { for(const it of d.items) listEl.appendChild(renderRow(it)); }
      $("s-in").textContent=money(d.received); $("s-out").textContent=money(d.spent);
      $("s-net").textContent=(d.net<0?"−":"")+money(Math.abs(d.net));
      if(window.feather) feather.replace();
    }catch(e){ toast("Couldn't load","error"); }
  }

  async function del(id,el){
    if(!confirm("Delete this entry?")) return;
    try{
      const r=await fetch("/api/expenses/"+encodeURIComponent(id)+"/delete",{method:"POST",headers:{"X-CSRFToken":CSRF},credentials:"same-origin"});
      if(!r.ok) throw new Error();
      el.remove(); load(); loadReport();
    }catch(_){ toast("Couldn't delete","error"); }
  }

  // Upload a receipt to Drive, handling the "name already exists" case
  // by asking to overwrite or rename. Returns {file_id,name,web_view},
  // or "cancelled" if the user backs out.
  async function uploadReceipt(file, nameOverride, overwrite){
    const fd=new FormData();
    fd.append("file",file);
    if(nameOverride) fd.append("name",nameOverride);
    if(overwrite) fd.append("overwrite","true");
    const r=await fetch("/api/expenses/receipt",{method:"POST",headers:{"X-CSRFToken":CSRF},body:fd,credentials:"same-origin"});
    if(r.status===409){
      const d=await r.json();
      const ov=confirm(`A receipt named "${d.name}" already exists.\n\nOK = Overwrite it.\nCancel = save under a new name.`);
      if(ov) return uploadReceipt(file, nameOverride||d.name, true);
      const nn=prompt("New file name for the receipt:", d.name);
      if(!nn||!nn.trim()) return "cancelled";
      return uploadReceipt(file, nn.trim(), false);
    }
    const d=await r.json();
    if(!r.ok){
      if(d.connect_url && confirm("Connect Google Drive to save receipts?")) location.href=d.connect_url;
      throw new Error(d.error||"Receipt upload failed");
    }
    return d;
  }

  function formBody(){
    return {
      kind,
      spent_on: dateEl.value,
      amount: parseFloat(amountEl.value),
      category: catEl.value.trim(),
      note: noteEl.value.trim(),
      tag: tagEl.value.trim(),
      recurrence: recEl.value,
      need_want: needEl.value,
      cost_type: costEl.value,
    };
  }

  form.addEventListener("submit",async(e)=>{
    e.preventDefault();
    if(amountEl.value===""||!(parseFloat(amountEl.value)>=0)){ toast("Enter an amount","error"); amountEl.focus(); return; }
    addBtn.disabled=true;
    try{
      if(editingId){
        // Edit — receipt is managed separately, so don't touch it here.
        const r=await fetch("/api/expenses/"+encodeURIComponent(editingId),{method:"PUT",headers:{"Content-Type":"application/json","X-CSRFToken":CSRF},body:JSON.stringify(formBody()),credentials:"same-origin"});
        const d=await r.json();
        if(!r.ok) throw new Error(d.error||"");
        toast("Saved","success"); resetForm();
        await load(); loadCategories(); loadReport();
        return;
      }
      // Add — upload receipt first (if attached, from picker or camera).
      let receipt=null;
      if(receiptFile){
        toast("Uploading receipt…");
        receipt=await uploadReceipt(receiptFile);
        if(receipt==="cancelled"){ toast("Receipt cancelled — entry not saved","info"); addBtn.disabled=false; return; }
      }
      const body=formBody();
      if(receipt){ body.receipt_file_id=receipt.file_id; body.receipt_url=receipt.web_view; body.receipt_name=receipt.name; }
      const r=await fetch("/api/expenses",{method:"POST",headers:{"Content-Type":"application/json","X-CSRFToken":CSRF},body:JSON.stringify(body),credentials:"same-origin"});
      const d=await r.json();
      if(!r.ok) throw new Error(d.error||"");
      resetForm(); amountEl.focus();
      await load(); loadCategories(); loadReport();
    }catch(e){ toast(e.message||"Couldn't save","error"); }
    finally{ addBtn.disabled=false; }
  });

  dateEl.addEventListener("change",load);

  // ── Monthly report ──
  function updatePdfLink(){
    repPdf.href="/expenses/print?month="+encodeURIComponent(repMonth.value||"");
  }
  async function loadReport(){
    updatePdfLink();
    try{
      const url="/api/expenses/report?month="+encodeURIComponent(repMonth.value)+"&by="+encodeURIComponent(repBy.value);
      const r=await fetch(url,{credentials:"same-origin"});
      const d=await r.json();
      $("r-in").textContent=money(d.income); $("r-out").textContent=money(d.expense);
      $("r-net").textContent=(d.net<0?"−":"")+money(Math.abs(d.net));
      const rt=$("r-transfers");
      if (rt) rt.textContent = (d.transfers ? "Transfers this month: " + money(d.transfers) : "");
      const rp=$("r-proj");
      if (rp) rp.textContent = (d.projected_monthly ? "↻ Recurring (normalised): " + money(d.projected_monthly) + "/mo · " + money(d.projected_yearly) + "/yr" : "");
      const cats=d.breakdown||[];
      if(!cats.length){ repCats.innerHTML=`<div class="empty">No spending this month.</div>`; return; }
      const total=cats.reduce((s,c)=>s+c.amount,0)||1;
      const max=Math.max(...cats.map(c=>c.amount),1);
      repCats.innerHTML=cats.map(c=>`
        <div class="cat-row">
          <span class="cn">${esc(c.label)}<span class="pct">${Math.round(100*c.amount/total)}%</span></span>
          <span class="bar"><i style="width:${Math.round(100*c.amount/max)}%"></i></span>
          <span class="ca">${money(c.amount)}</span>
        </div>`).join("");
    }catch(e){ /* non-fatal */ }
  }
  repMonth.addEventListener("change",loadReport);
  repBy.addEventListener("change",loadReport);

  // Boot
  repMonth.value = "{{ today }}".slice(0,7);
  if(window.feather) feather.replace();
  loadCategories(); load(); loadReport();
})();
</script>
</body>
</html>
