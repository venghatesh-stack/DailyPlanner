name: Notes widget APK

on:
  push:
    paths:
      - "android-notes-widget/**"
      - ".github/workflows/notes-widget.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: notes-widget
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        working-directory: android-notes-widget
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
          cp app/build/outputs/apk/release/app-release.apk DailyPlannerNotesWidget.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          APK=android-notes-widget/DailyPlannerNotesWidget.apk
          TITLE="DailyPlanner Notes widget (build ${{ github.run_number }})"
          NOTES="Android home-screen widget for Color Notes. Install the APK, then connect it from Color Notes -> Widget. Built from ${{ github.sha }}."
          # A draft is invisible to the public (404). Remove any stuck drafts first.
          for id in $(gh api "repos/$REPO/releases?per_page=100" --jq '.[] | select(.tag_name=="notes-widget" and .draft) | .id'); do
            gh api -X DELETE "repos/$REPO/releases/$id"
          done
          if gh release view notes-widget >/dev/null 2>&1; then
            # Update in place: replace the APK, keep the release published.
            gh release upload notes-widget "$APK" --clobber
            gh release edit notes-widget --title "$TITLE" --notes "$NOTES" --draft=false
          else
            gh release create notes-widget "$APK" --title "$TITLE" --notes "$NOTES" --target "${{ github.sha }}"
          fi
          id=$(gh api "repos/$REPO/releases?per_page=100" --jq '[.[] | select(.tag_name=="notes-widget")][0].id')
          gh api -X PATCH "repos/$REPO/releases/$id" -F draft=false -F prerelease=false >/dev/null
          gh release delete notes-widget-build-log --yes --cleanup-tag || true

      - name: Check the public download link works
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsIL "https://github.com/${{ github.repository }}/releases/download/notes-widget/DailyPlannerNotesWidget.apk" >/dev/null; then
              echo "Download link OK"; exit 0
            fi
            sleep 10
          done
          echo "The public APK link is not reachable"; exit 1

      - name: Publish build log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete notes-widget-build-log --yes --cleanup-tag || true
          gh release create notes-widget-build-log android-notes-widget/build.log \
            --title "Notes widget build failed (run ${{ github.run_number }})" \
            --notes "Build log for the failed run." --target "${{ github.sha }}" --prerelease || true
